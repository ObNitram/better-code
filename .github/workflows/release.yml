name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag version : $TAG_VERSION"
          echo "package.json version : $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build VSIX
        run: npm run build:vsix

      - name: Prepare release notes from changelog
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_VERSION#v}"
          PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -Fxv "$TAG_VERSION" | head -n 1 || true)
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { in_section = 1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::No changelog entry found for version $VERSION"
            exit 1
          fi

          {
            cat release-notes.md
            printf '\n\n---\n\nFor the full changelog, see [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md).\n' \
              "$GITHUB_REPOSITORY" "$TAG_VERSION"
            if [ -n "$PREVIOUS_TAG" ]; then
              printf '\n**Full Changelog**: [%s...%s](https://github.com/%s/compare/%s...%s)\n' \
                "$PREVIOUS_TAG" "$TAG_VERSION" "$GITHUB_REPOSITORY" "$PREVIOUS_TAG" "$TAG_VERSION"
            fi
          } > release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: "*.vsix"
          body_path: release-body.md
